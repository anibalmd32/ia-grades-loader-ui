# Versión web de Notas. Uso: API_URL=https://api.ejemplo.com/api/v1 docker compose up -d --build
services:
  web:
    build: .
    image: notas-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      API_URL: ${API_URL:?Define API_URL, p. ej. http://localhost:8000/api/v1}
