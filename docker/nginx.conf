server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Las cabeceras de seguridad van en cada location: en nginx, un add_header dentro de un
  # location anula todos los del bloque server
  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Archivos con hash en el nombre: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # index.html y config.js siempre frescos
  location = /config.js {
    add_header Cache-Control "no-store";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # SPA: las rutas del router devuelven index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
}
