<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: zonas seguras (notch, barra de gestos); resizes-content: el teclado
         encoge la página en lugar de taparla -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#252b45" />
    <title>Notas</title>
    <style>
      /* Pantalla de carga hasta que arranca React (React la reemplaza al montar) */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #252b45;
      }
      .boot img {
        width: 96px;
        height: 96px;
      }
      .boot span {
        width: 32px;
        height: 32px;
        border: 3px solid rgb(255 255 255 / 0.2);
        border-top-color: #22a6f0;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot span {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Cargando Notas">
        <img src="/favicon.svg" alt="" />
        <span></span>
      </div>
    </div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
