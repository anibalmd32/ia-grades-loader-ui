name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Comprobar el formato del tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::El tag $GITHUB_REF_NAME no tiene el formato vX.Y.Z"
            exit 1
          fi

      # Borrador hasta que terminen todos los builds
      - name: Crear release en borrador
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="Notas $GITHUB_REF_NAME" \
            -F draft=true -F generate_release_notes=true --jq .id)
          if [ -z "$id" ]; then
            echo "::error::No se pudo crear el release"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: bun install --frozen-lockfile

      # La versión de la app sale del tag (en el repo se queda fija en 0.0.1)
      - name: Poner la versión del tag
        shell: bash
        run: bun scripts/set-version.ts "${GITHUB_REF_NAME#v}"

      - name: Compilar y subir instaladores (NSIS y MSI)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VITE_API_URL: ${{ secrets.VITE_API_URL_PROD }}
        with:
          tauriScript: bun run tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}

  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4

      - name: Instalar el NDK
        run: |
          sdkmanager --install "ndk;30.0.15729638"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.15729638" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: bun install --frozen-lockfile

      - name: Poner la versión del tag
        run: bun scripts/set-version.ts "${GITHUB_REF_NAME#v}"

      # keystore.properties y el .jks solo existen dentro del runner
      - name: Preparar el keystore de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # Teléfonos (arm64 y armv7) y emuladores (x86_64)
      - name: Compilar el APK
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_PROD }}
        run: bun run tauri android build --apk --target aarch64 armv7 x86_64

      - name: Subir el APK al release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          apk="Notas-$GITHUB_REF_NAME.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$apk"
          url="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$apk"
          gh api --method POST -H "Content-Type: application/vnd.android.package-archive" "$url" --input "$apk" --silent

  publish:
    needs: [create-release, windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --silent
